name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # Pre-existing type errors (mostly stale Supabase generated types) aren't
      # fixed yet, so this reports without blocking merges until they're cleared.
      - name: Typecheck (non-blocking)
        run: npm run typecheck
        continue-on-error: true
