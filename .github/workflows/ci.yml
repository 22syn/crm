name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

  # Database permission (RLS) tests: applies every migration to a throwaway Postgres and
  # checks who can read / change what. See supabase/tests/rls/run.sh.
  rls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - name: RLS access matrix
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: supabase/tests/rls/run.sh

  secrets-scan:
    uses: 22syn/ci-templates/.github/workflows/node-ci.yml@main
    with:
      run-lint: false
      run-test: false
      run-build: false
      run-secrets-scan: true
